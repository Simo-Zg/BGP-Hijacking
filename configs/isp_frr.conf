frr version 10.5.0_git
frr defaults traditional
hostname isp-r2
!
bgp community-list standard COUNTER_ROUTE_TAG seq 5 permit 65000:666
!
route-map RM-EXABGP-IN permit 10
 match community COUNTER_ROUTE_TAG
 set local-preference 1000
exit
!
route-map RM-EXABGP-IN permit 20
!
route-map RM-RPKI-DROP deny 10
 match rpki invalid
exit
!
route-map RM-RPKI-DROP permit 20
!
router bgp 200
 bgp router-id 10.100.12.12
 no bgp ebgp-requires-policy
 neighbor 10.100.12.11 remote-as 100
 neighbor 10.100.12.14 remote-as 400
 neighbor 10.100.23.13 remote-as 300
 !
 address-family ipv4 unicast
  neighbor 10.100.12.14 route-map RM-EXABGP-IN in
  neighbor 10.100.23.13 route-map RM-RPKI-DROP in
 exit-address-family
exit
!
rpki
 rpki polling_period 60
 rpki cache tcp 10.100.12.15 8282 preference 1
exit
!
