process detect-script {
    run /usr/local/bin/python3 /app/detect.py;
    encoder json;
}

neighbor 10.100.12.12 {
    router-id 10.100.12.14;
    local-address 10.100.12.14;
    local-as 400;
    peer-as 200;
    group-updates false;

    api {
        processes [ detect-script ];
        receive {
            parsed;
            update;
        }
    }
}
